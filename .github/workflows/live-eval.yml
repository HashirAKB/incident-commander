name: live-eval
# Manual only: costs real money. Results are uploaded as an artifact, never committed.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IC_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Live smoke test
        run: uv run pytest -q tests/live
      - name: Live evals
        run: uv run python -m evals.run --mode live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-results
          path: evals/results/live-*
