name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      # The real telemetry-ops-copilot server at the pinned SHA, so contract and
      # integration tests run against it and not only against the stub.
      - run: ./scripts/fetch_telemetry.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Unit, integration and crash tests on SQLite (Postgres variants skip here).
      - run: uv run pytest -q
      # Mock evals must report zero unapproved writes (the script exits 1 otherwise)
      # and must reproduce the committed results byte for byte.
      - run: uv run python -m evals.run --mode mock
      - run: git diff --exit-code evals/results/
      # Required docs exist, no em dashes, README/COMPARISON numbers match their scripts.
      - run: uv run python -m scripts.check_dod

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ic
          POSTGRES_PASSWORD: ic
          POSTGRES_DB: ic
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ic:ic@localhost:5432/ic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # Checkpointer, ledger and crash tests against Postgres.
      - run: uv run pytest -q -m postgres

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: APPROVER_TOKEN=ci TELEMETRY_MCP_TOKEN=ci docker compose config -q
      - name: Build the app image
        run: docker build --target app -t incident-commander-app .
      - name: Build the telemetry image (real server at the pinned SHA)
        run: docker build --target telemetry -t incident-commander-telemetry .
